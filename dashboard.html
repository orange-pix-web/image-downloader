<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI 自动生图任务管理器</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>AI 自动生图任务管理器</h1>
          <p>支持 ChatGPT 与豆包，自动匹配产品图片和 Markdown，完整生成后再按产品名下载。</p>
        </div>
        <span id="run-state" class="badge">未开始</span>
      </header>

      <section class="panel setup">
        <div class="tab-binding">
          <strong>当前绑定的生图页面</strong>
          <div class="binding-row">
            <select id="target-tab"><option value="">正在读取页面…</option></select>
            <button id="refresh-tabs" type="button" class="secondary">刷新列表</button>
            <button id="bind-tab" type="button">绑定所选页面</button>
          </div>
          <p id="binding-detail" class="note">任务只会发送到这里，不会自动切换到其他标签页。</p>
        </div>
        <label class="picker">
          <strong>① 选择产品图片（可多选）</strong>
          <input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple />
        </label>
        <label class="picker">
          <strong>② 选择参考图片（可选，可多选）</strong>
          <input id="references" type="file" accept="image/png,image/jpeg,image/webp" multiple />
        </label>
        <label class="picker">
          <strong>③ 选择提示词 Markdown（可多选）</strong>
          <input id="prompts" type="file" accept=".md,text/markdown,text/plain" multiple />
        </label>
        <label class="picker folder-picker">
          <strong>或者：选择完整任务文件夹</strong>
          <input id="task-folder" type="file" webkitdirectory directory multiple />
          <span class="note">简洁格式：根目录放“禽益生.png”，同名“禽益生”文件夹里放参考图；Markdown也放根目录。选择文件夹后优先使用文件夹内容。</span>
        </label>

        <div class="prompt-builder">
          <strong>提示词预设</strong>
          <div class="prompt-grid">
            <label>生图模式
              <select id="prompt-preset">
                <option value="original">原始 Markdown</option>
                <option value="replace">产品与品牌替换</option>
                <option value="composition">仅参考构图重新生成</option>
                <option value="custom">自定义模板</option>
              </select>
            </label>
            <label>参考图配对
              <select id="reference-mode">
                <option value="auto">自动：单张共用，多张同名</option>
                <option value="common">全部参考图用于每个产品</option>
                <option value="same-name">仅按产品名配对</option>
              </select>
            </label>
            <label>品牌名（可选）<input id="brand-name" type="text" placeholder="默认以产品图包装为准" /></label>
            <label>指定文案（可选）<input id="specified-copy" type="text" placeholder="需要出现在图片中的文案" /></label>
            <label>无 Markdown 时生成数量<input id="preset-count" type="number" min="1" max="20" value="1" /></label>
            <label>每批最多附件数<input id="max-attachments" type="number" min="2" max="20" value="10" /></label>
            <label class="check-setting"><input id="folder-one-to-one" type="checkbox" checked />文件夹任务一张参考图对应一张输出</label>
            <label>固定提示词位置
              <select id="fixed-position">
                <option value="append">追加到末尾</option>
                <option value="prepend">放在开头</option>
                <option value="replace">替代 Markdown</option>
              </select>
            </label>
          </div>
          <label class="wide-field">固定提示词（所有任务共用）
            <textarea id="fixed-prompt" rows="3" placeholder="例如：画面比例1:1，高清商业摄影，包装文字准确。"></textarea>
          </label>
          <label class="wide-field">参考图禁用文字（所有产品共用，用顿号、逗号或换行分隔）
            <textarea id="forbidden-reference-text" rows="2" placeholder="例如：原品牌、旧品名、旧活动文案"></textarea>
          </label>
          <label class="wide-field">按产品设置旧文字（每行：目标产品=参考图旧文字）
            <textarea id="product-text-rules" rows="3" placeholder="禽益生=禽一片&#10;鸽虫净=鸽虫清、旧品牌名"></textarea>
          </label>
          <div class="disclaimer-box">
            <label class="check-setting"><input id="disclaimer-enabled" type="checkbox" />启用图片声明</label>
            <div class="prompt-grid">
              <label>添加方式
                <select id="disclaimer-mode">
                  <option value="overlay">下载时精确叠加</option>
                  <option value="prompt">写入生图提示词</option>
                  <option value="both">提示词生成 + 下载叠加</option>
                </select>
              </label>
              <label>声明位置
                <select id="disclaimer-position">
                  <option value="bottom-center">底部居中</option>
                  <option value="bottom-right">右下角</option>
                  <option value="bottom-left">左下角</option>
                </select>
              </label>
              <label>放置方式
                <select id="disclaimer-layout">
                  <option value="footer">扩展底部声明区（不遮挡）</option>
                  <option value="overlay">覆盖在原图安全边缘</option>
                </select>
              </label>
              <label>字号（图片宽度%）<input id="disclaimer-font-percent" type="number" min="0.6" max="4" step="0.1" value="1.2" /></label>
              <label>文字透明度（%）<input id="disclaimer-opacity" type="number" min="30" max="100" step="5" value="65" /></label>
              <label class="check-setting"><input id="disclaimer-background" type="checkbox" checked />使用淡色半透明底</label>
            </div>
            <label class="wide-field">声明文字
              <textarea id="disclaimer-text" rows="2">以上仅代表本产品的各种可使用场景
不代表任何功效、症状等情况</textarea>
            </label>
            <p class="note">下载叠加可保证文字准确；豆包原生“保存”目前会自动使用提示词声明，不进行下载后叠字。</p>
          </div>
          <label id="custom-template-wrap" class="wide-field hidden">自定义模板
            <textarea id="custom-template" rows="7" placeholder="支持 {产品名}、{品牌名}、{指定文案}、{禁用文字}、{文字替换要求}、{Markdown提示词}、{参考图数量}、{产品图序号}、{生成数量}"></textarea>
          </label>
        </div>

        <div class="settings">
          <label>轮询间隔（秒）<input id="poll-seconds" type="number" min="5" max="300" value="30" /></label>
          <label>最大等待（分钟）<input id="timeout-minutes" type="number" min="5" max="180" value="40" /></label>
          <label>稳定确认次数<input id="stable-rounds" type="number" min="1" max="5" value="2" /></label>
          <label>无进展刷新（分钟）<input id="refresh-minutes" type="number" min="1" max="60" value="5" /></label>
          <label>最多自动刷新<input id="max-refreshes" type="number" min="1" max="10" value="2" /></label>
          <label class="check-setting"><input id="auto-refresh" type="checkbox" checked />启用自动刷新</label>
          <label class="check-setting"><input id="new-chat-each-task" type="checkbox" />每个任务使用新对话</label>
        </div>

        <div class="actions">
          <button id="build">生成任务列表</button>
          <button id="start" disabled>开始执行</button>
          <button id="pause" class="secondary" disabled>暂停</button>
          <button id="clear-history" class="danger">清空全部历史</button>
        </div>
        <p class="note">Markdown 中的代码块会作为完整提示词发送；“生成9张”等文字会自动识别为预期图片数量。开启“每个任务使用新对话”后，每次发送前会在已绑定标签页进入新对话；自定义 GPT 身份会保留。</p>
      </section>

      <section class="panel">
        <h2>任务列表</h2>
        <div id="summary">尚未导入文件。</div>
        <table>
          <thead><tr><th>#</th><th>产品</th><th>提示词文件</th><th>参考图/预设</th><th>预期</th><th>起始编号</th><th>文件范围</th><th>状态</th></tr></thead>
          <tbody id="tasks"></tbody>
        </table>
      </section>

      <section class="panel">
        <h2>运行日志</h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="dashboard.js"></script>
  </body>
</html>
